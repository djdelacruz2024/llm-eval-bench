[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-bench"
version = "0.1.0"
description = "Open-source, multi-model LLM benchmarking and evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
huggingface = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
llm-eval-bench = "llm_eval_bench.cli:main"

[tool.setuptools.packages.find]
include = ["llm_eval_bench*"]

[tool.setuptools.package-data]
"llm_eval_bench.dashboard" = ["templates/*.html", "static/*"]
